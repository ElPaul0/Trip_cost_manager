{% extends "base.html" %}
{% block title %}Modifier opération — {{ vehicle.name }}{% endblock %}
{% block content %}
<section class="section">
  <p class="eyebrow"><a href="/vehicles/{{ vehicle.id }}/maintenance">← Carnet d’entretien</a></p>
  <h1>Modifier l’opération</h1>
  <p class="section-lead">{{ vehicle.name }} · {{ operation.name }}</p>

  {% if error %}
  <p class="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/vehicles/{{ vehicle.id }}/maintenance/{{ operation.id }}/edit" class="form-grid">
    <label>
      Nom
      <input type="text" name="name" required value="{{ form.name }}">
    </label>
    <label>
      Date
      <input type="date" name="operation_date" required value="{{ form.operation_date }}">
    </label>
    <label>
      Kilométrage (km)
      <input type="number" name="mileage_km" step="0.1" min="0" required value="{{ form.mileage_km }}">
    </label>
    <label>
      Prix (€)
      <input type="number" name="price" step="0.01" min="0" required value="{{ form.price }}">
    </label>
    <label class="full">
      Lien pièce / produit (optionnel)
      <input type="url" name="parts_url" value="{{ form.parts_url }}" placeholder="https://...">
    </label>
    <label class="full">
      Commentaires
      <textarea name="comments" rows="3">{{ form.comments }}</textarea>
    </label>
    <div class="form-actions full">
      <button type="submit" class="btn primary">Enregistrer</button>
      <a class="btn ghost" href="/vehicles/{{ vehicle.id }}/maintenance">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
