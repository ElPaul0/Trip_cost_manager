# Déploiement serveur — aucun clone du code nécessaire.
# 1. Copier ce fichier + .env.example sur le serveur
# 2. cp .env.example .env  puis éditer POSTGRES_PASSWORD
# 3. docker compose -f docker-compose.deploy.yml up -d
#
# Images disponibles (GHCR, publiées par GitHub Actions) :
#   ghcr.io/elpaul0/trip_cost_manager:latest   — dernière version main
#   ghcr.io/elpaul0/trip_cost_manager:1.0      — version figée (rollback)
#   ghcr.io/elpaul0/trip_cost_manager:1.1      — etc.
#
# Pinnez APP_IMAGE dans .env pour choisir la version (ex. :1.0).
#
# DONNÉES : le volume postgres_data conserve la base entre mises à jour.
#   docker compose pull && docker compose up -d   → met à jour l'app, garde les données
#   docker compose down -v                        → SUPPRIME la base (à éviter)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-trip_cost_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripuser} -d ${POSTGRES_DB:-trip_cost_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/elpaul0/trip_cost_manager:latest}
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tripuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trip_cost_manager}
      HERE_API_KEY: ${HERE_API_KEY:-}
      HERE_ENABLED: ${HERE_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
