# Exemple de déploiement serveur
# 1. Copier ce fichier en docker-compose.yml (ou garder les deux)
# 2. Créer un fichier .env à côté (voir .env.example)
# 3. Lancer : docker compose up -d --build
#
# L'app écoute sur APP_PORT (8000 par défaut).
# Place un reverse proxy (Caddy / Nginx / Traefik) devant si tu veux HTTPS.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Pas d'exposition publique du port Postgres en prod

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
